/* =====================================================================
   INLINE PURE-LOGIC COPY
   The functions below are copied verbatim from js/app.js so this file
   works standalone without any script-src loading.  When app.js changes,
   keep this section in sync.
   ===================================================================== */

// ── Key constants ──────────────────────────────────────────────────────
const KEYS = {
  TRANSACTIONS: 'evb_transactions',
  CATEGORIES:   'evb_categories',
  THEME:        'evb_theme',
};

// ── Safe defaults ──────────────────────────────────────────────────────
const DEFAULTS = {
  transactions: [],
  categories:   ['Food', 'Transport', 'Fun'],
  theme:        'light',
};

// ── StorageManager ─────────────────────────────────────────────────────
const StorageManager = {
  load() {
    let transactions = DEFAULTS.transactions;
    try {
      const raw = localStorage.getItem(KEYS.TRANSACTIONS);
      if (raw !== null) {
        const parsed = JSON.parse(raw);
        transactions = Array.isArray(parsed) ? parsed : DEFAULTS.transactions;
      }
    } catch (e) {
      console.warn('[StorageManager] Failed to parse transactions; using default.', e);
      transactions = DEFAULTS.transactions;
    }

    let categories = DEFAULTS.categories;
    try {
      const raw = localStorage.getItem(KEYS.CATEGORIES);
      if (raw !== null) {
        const parsed = JSON.parse(raw);
        categories = Array.isArray(parsed) ? parsed : DEFAULTS.categories;
      }
    } catch (e) {
      console.warn('[StorageManager] Failed to parse categories; using default.', e);
      categories = DEFAULTS.categories;
    }

    let theme = DEFAULTS.theme;
    try {
      const raw = localStorage.getItem(KEYS.THEME);
      if (raw === 'light' || raw === 'dark') {
        theme = raw;
      }
    } catch (e) {
      console.warn('[StorageManager] Failed to read theme; using default.', e);
      theme = DEFAULTS.theme;
    }

    return { transactions, categories, theme };
  },

  save(state) {
    const trySet = (key, value) => {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        if (
          e instanceof DOMException &&
          (e.name === 'QuotaExceededError' ||
           e.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
           e.code === 22)
        ) {
          console.warn(
            `[StorageManager] localStorage quota exceeded while saving key "${key}".`, e
          );
        } else {
          throw e;
        }
      }
    };

    trySet(KEYS.TRANSACTIONS, JSON.stringify(state.transactions));
    trySet(KEYS.CATEGORIES,   JSON.stringify(state.categories));
    trySet(KEYS.THEME, state.theme);
  },
};

// ── Validator ──────────────────────────────────────────────────────────
const Validator = {
  validateName(value) {
    const trimmed = (value ?? '').trim();
    if (trimmed.length === 0) {
      return 'Item name is required.';
    }
    if (trimmed.length > 100) {
      return 'Item name must be 100 characters or fewer.';
    }
    return null;
  },

  validateAmount(value) {
    const str = String(value ?? '').trim();
    if (str === '') {
      return 'Amount is required.';
    }
    const num = parseFloat(str);
    if (!isFinite(num) || String(num) !== str && !/^-?\d+(\.\d+)?$/.test(str)) {
      return 'Amount must be a valid number between 0.01 and 999,999,999.99 with up to two decimal places.';
    }
    if (num < 0.01 || num > 999999999.99) {
      return 'Amount must be between 0.01 and 999,999,999.99.';
    }
    const decimalIndex = str.indexOf('.');
    if (decimalIndex !== -1 && str.length - decimalIndex - 1 > 2) {
      return 'Amount must have at most two decimal places.';
    }
    return null;
  },

  validateCategory(value) {
    if (value === null || value === undefined || String(value).trim() === '') {
      return 'Please select a category.';
    }
    return null;
  },
};

// ── computeBalance ─────────────────────────────────────────────────────
function computeBalance(transactions) {
  return transactions.reduce((sum, t) => sum + t.amount, 0);
}

// ── computeChartData ───────────────────────────────────────────────────
function computeChartData(transactions) {
  if (!transactions || transactions.length === 0) return null;

  const totals = {};
  transactions.forEach(t => {
    totals[t.category] = (totals[t.category] || 0) + t.amount;
  });

  const categories = Object.keys(totals).filter(cat => totals[cat] > 0);
  if (categories.length === 0) return null;

  const grandTotal = categories.reduce((sum, cat) => sum + totals[cat], 0);
  const percentages = categories.map(cat =>
    parseFloat((totals[cat] / grandTotal * 100).toFixed(1))
  );
  const labels = categories.map((cat, i) => `${cat} ${percentages[i]}%`);

  return {
    labels,
    percentages,
    amounts: categories.map(cat => totals[cat]),
  };
}

// ── monthlySummary ─────────────────────────────────────────────────────
function monthlySummary(transactions) {
  const groups = {};
  transactions.forEach(t => {
    const date = new Date(t.date);
    const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    if (!groups[key]) {
      groups[key] = { key, year: String(date.getFullYear()), monthIndex: date.getMonth(), total: 0, count: 0 };
    }
    groups[key].total += t.amount;
    groups[key].count += 1;
  });

  return Object.values(groups)
    .sort((a, b) => b.key.localeCompare(a.key));
}

// ── formatCurrency ─────────────────────────────────────────────────────
function formatCurrency(amount) {
  return amount.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
}

// ── validateCategoryName ───────────────────────────────────────────────
function validateCategoryName(value, existingCategories) {
  const trimmed = (value ?? '').trim();
  if (trimmed.length === 0) {
    return 'Category name cannot be blank.';
  }
  if (trimmed.length > 50) {
    return 'Category name must be 50 characters or fewer.';
  }
  const isDuplicate = existingCategories.some(
    c => c.trim().toLowerCase() === trimmed.toLowerCase()
  );
  if (isDuplicate) {
    return 'That category already exists.';
  }
  return null;
}

/* =====================================================================
   TEST HARNESS
   ===================================================================== */

const results = [];   // { suite, label, pass, error }

/** Register and immediately run one test. */
function test(suite, label, fn) {
  try {
    fn();
    results.push({ suite, label, pass: true, error: null });
  } catch (err) {
    results.push({ suite, label, pass: false, error: String(err) });
  }
}

/** Simple equality assertion. */
function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error(
      (msg ? msg + '\n' : '') +
      `  Expected: ${JSON.stringify(expected)}\n` +
      `  Actual:   ${JSON.stringify(actual)}`
    );
  }
}

/** Assert value is null. */
function assertNull(actual, msg) {
  if (actual !== null) {
    throw new Error((msg ? msg + '\n' : '') + `  Expected null but got: ${JSON.stringify(actual)}`);
  }
}

/** Assert value is not null. */
function assertNotNull(actual, msg) {
  if (actual === null || actual === undefined) {
    throw new Error((msg ? msg + '\n' : '') + '  Expected a non-null value but got null/undefined');
  }
}

/** Assert value is a non-empty string (i.e. an error message). */
function assertError(actual, msg) {
  if (typeof actual !== 'string' || actual.length === 0) {
    throw new Error(
      (msg ? msg + '\n' : '') +
      `  Expected a non-empty error string but got: ${JSON.stringify(actual)}`
    );
  }
}

/** Deep-equal for plain objects/arrays (simple JSON-based). */
function assertDeepEqual(actual, expected, msg) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) {
    throw new Error(
      (msg ? msg + '\n' : '') +
      `  Expected: ${e}\n` +
      `  Actual:   ${a}`
    );
  }
}

/* =====================================================================
   HELPER — wipe only EVB keys from localStorage between storage tests
   ===================================================================== */
function clearEvbStorage() {
  localStorage.removeItem(KEYS.TRANSACTIONS);
  localStorage.removeItem(KEYS.CATEGORIES);
  localStorage.removeItem(KEYS.THEME);
}

test('Validator.validateName', 'undefined → returns error (nullish input)', () => {

test('StorageManager.load — corruption', 'evb_transactions corrupt + others valid → only transactions falls back', () => {
  clearEvbStorage();
  localStorage.setItem(KEYS.TRANSACTIONS, 'CORRUPT');
  localStorage.setItem(KEYS.CATEGORIES, JSON.stringify(['Custom']));
  localStorage.setItem(KEYS.THEME, 'dark');
  const result = StorageManager.load();

test('monthlySummary', '3 transactions across 2 months → correct totals per group', () => {

    { amount: 10, date: '2024-05-01T00:00:00Z' },

  assertEqual(result[0].count, 1, 'June should have 1 transaction');

  ];
  const result = monthlySummary(txs);
  assertEqual(result.length, 3, 'Should produce 3 groups');

    { amount: 100, date: '2024-01-01T00:00:00Z' },

test('monthlySummary', 'each group has a valid key in YYYY-MM format', () => {
  const txs = [
    { amount: 10, date: '2024-11-26T00:00:00Z' },
    { amount: 20, date: '2025-01-01T00:00:00Z' },

/* =====================================================================
   RENDER RESULTS
   ===================================================================== */

;(function renderResults() {
  const output  = document.getElementById('output');
  const footer  = document.getElementById('footer');
  const total   = results.length;
  const passed  = results.filter(r => r.pass).length;
  const failed  = total - passed;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pass').textContent  = passed;
  document.getElementById('stat-fail').textContent  = failed;

  // Group by suite
  const suites = {};
  results.forEach(r => {
    if (!suites[r.suite]) suites[r.suite] = [];
    suites[r.suite].push(r);
  });

  Object.entries(suites).forEach(([suiteName, tests]) => {
    const suitePass = tests.filter(t => t.pass).length;
    const div = document.createElement('div');
    div.className = 'suite';

    const title = document.createElement('div');
    title.className = 'suite-title';
    title.innerHTML =
      `${suiteName} <span>${suitePass}/${tests.length} passed</span>`;
    div.appendChild(title);

    tests.forEach(r => {
      const row = document.createElement('div');
      row.className = `test ${r.pass ? 'pass' : 'fail'}`;

      const badge = document.createElement('span');
      badge.className = `badge ${r.pass ? 'pass' : 'fail'}`;
      badge.textContent = r.pass ? 'PASS' : 'FAIL';

      const label = document.createElement('div');
      label.className = 'test-label';
      // Wrap `code` portions (backtick-delimited)
      label.innerHTML = r.label.replace(/`([^`]+)`/g, '<code>$1</code>');

      row.appendChild(badge);
      row.appendChild(label);

      if (!r.pass && r.error) {
        const errBlock = document.createElement('div');
        errBlock.className = 'error-block';
        errBlock.textContent = r.error;
        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'flex:1;min-width:0';
        wrapper.appendChild(label);
        wrapper.appendChild(errBlock);
        row.replaceChild(wrapper, label);
      }

      div.appendChild(row);
    });

    output.appendChild(div);
  });

  const allPass = failed === 0;
  footer.innerHTML =
    `<strong style="color:${allPass ? '#34d399' : '#f87171'}">` +
    `${allPass ? '✅ All tests passed!' : `❌ ${failed} test${failed !== 1 ? 's' : ''} failed.`}` +
    `</strong> &nbsp; Run at ${new Date().toLocaleTimeString()}.`;
})();
</script>
